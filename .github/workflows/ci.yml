name: Microservice CI Pipeline

on:
  push:
    branches: [ dev ]
  # pull_request:
  #   branches: [  ]

env:
  REGISTRY: docker.io
  FRONTEND_IMAGE: akhilmanoj03/frontend
  AUTH_IMAGE: akhilmanoj03/authentication
  PRODUCT_IMAGE: akhilmanoj03/product
  RECOMMENDATION_IMAGE: akhilmanoj03/recommendation
  DATABASE_IMAGE: akhilmanoj03/database
  OTEL_IMAGE: akhilmanoj03/otel-collector
  RUST_VERSION: 1.87.0
  GO_VERSION: 1.23
  PYTHON_VERSION: 3.13
  NODE_VERSION: 22

jobs:
  # Job 1: Run unit tests in parallel for all services
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, product]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (for frontend)
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Set up Python (for Product services)
        if: matrix.service == 'product'
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './${{ matrix.service }}/requirements.txt'

      # - name: Set up Go (for Recommendation services)
      #   if: matrix.service == 'recommendation'
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version: ${{ env.GO_VERSION }}
      #     cache-dependency-path: |
      #       ./recommendation/go.mod
      #       ./recommendation/go.sum

      # - name: Set up Rust (for Authentication services)
      #   if: matrix.service == 'authentication'
      #   run: |
      #     rustup install ${{ env.RUST_VERSION }}

      - name: Install dependencies and run tests (Frontend)
        if: matrix.service == 'frontend'
        run: |
          cd frontend
          npm ci
          npm run test

      - name: Install dependencies and run tests (Product)
        if: matrix.service == 'product'
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          python tests/run_tests.py all

      # - name: Install dependencies and run tests (Recommendation)
      #   if: matrix.service == 'recommendation'
      #   run: |
      #     cd ${{ matrix.service }}
      #     go mod download
      #     go mod verify
      #     go mod tidy
      #     go test ./tests/...

      # - name: Install dependencies and run tests (Authentication)
      #   if: matrix.service == 'authentication'
      #   run: |
      #     cd ${{ matrix.service }}
      #     cargo test

  build-images:
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, product]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/${{ matrix.service }}-${{ github.sha }}-image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: /tmp/${{ matrix.service }}-${{ github.sha }}-image.tar
          retention-days: 1

  # Job 3: Integration and E2E tests
  integration-tests:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/images

      - name: Load Docker images
        run: |
          # Load each image and tag it properly
          for image_dir in /tmp/images/*/; do
            service_name=$(basename "$image_dir")
            echo "Loading image for service: $service_name"
            docker load -i "$image_dir"/*.tar
          done
          
          # List loaded images for debugging
          echo "Loaded images:"
          docker images | grep "ci-${{ github.sha }}"

      - name: Create test environment file
        run: |
          cat > ci/.env << EOF
          APP_VERSION=1.0.0
          INTERNAL_API_KEY="your-secure-internal-api-key"
          LOG_LEVEL=DEBUG

          # Database
          POSTGRES_DB=products-db
          POSTGRES_USER=devops
          POSTGRES_PASSWORD=catalogue
          POSTGRES_HOST=products-db
          POSTGRES_PORT=5432
          DATABASE_URL=postgres://devops:catalogue@products-db:5432/products-db
          
          # Observability
          OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
          EOF
       
      - name: install and setup docker-compose
        uses: docker/setup-compose-action@v1.2.0
        with:
          version: v2.32.4

      - name: Start services with Docker Compose
        run: |
          cd ci
          GITHUB_SHA=${{ github.sha }} docker compose -f docker-compose.yml up -d
          
      - name: Run integration tests
        run: |
          # Example integration test script
          cd tests/integration
          ./integration_runner.sh
          
      # - name: Run E2E tests
      #   run: |
      #     # Install test dependencies
      #     pip install requests pytest
          
      #     # Run E2E tests against running services
      #     python -m pytest tests/e2e/ -v --tb=short --base-url=http://localhost:3000

      - name: Collect service logs on failure
        if: failure()
        run: |
          cd ci
          echo "=== Frontend Logs ==="
          docker compose -f docker-compose.yml logs frontend
          echo "=== Auth Logs ==="
          docker compose -f docker-compose.yml logs authentication
          echo "=== Product Logs ==="
          docker compose -f docker-compose.yml logs products
          echo "=== Recommendation Logs ==="
          docker compose -f docker-compose.yml logs recommendation
          echo "=== Database Logs ==="
          docker compose -f docker-compose.yml logs products-db

      - name: Cleanup
        if: always()
        run: |
          cd ci
          docker compose -f docker-compose.yml down -v

