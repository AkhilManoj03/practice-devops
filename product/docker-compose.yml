networks:
  craftista:
    driver: bridge

services:
  products:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - products-db
      - redis
      - authentication
    env_file:
      - .env
    networks:
      - craftista
    ports:
      - "8000:8000"

  products-db:
    build:
      context: ../database
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - craftista
    
  redis:
    image: redis:8.0.0-alpine
    networks:
      - craftista
    ports:
      - "6379:6379"
  
  authentication:
    build: ../authentication
    networks:
      - craftista
    ports:
      - "8082:8082"
    env_file:
      - .env
    depends_on:
      - products-db
  
  recommendation:
    build:
      context: ../recommendation
      dockerfile: Dockerfile
    depends_on:
      - products-db
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - craftista
  
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - authentication
      - products
      - recommendation
    networks:
      - craftista

